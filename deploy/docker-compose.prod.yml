# Despliegue de producción en una sola VM. Uso (desde la raíz del repo):
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Las variables salen de `deploy/.env` (ver `.env.prod.example`).
name: gestor-gastos

# El disco de la VM es de 50 GB: sin rotación, los logs terminan llenándolo.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sin `ports`: la base solo es alcanzable desde la red interna de Compose.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # De un solo uso: aplica las migraciones pendientes y termina.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      # La etapa `build` conserva el CLI de Prisma, que la imagen final no trae.
      target: build
    working_dir: /app/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy']
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # La imagen no trae curl ni wget; se usa el `fetch` de Node.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3
      - '443:443/udp'
    volumes:
      # Guarda el certificado: sin esto Caddy lo pediría de nuevo en cada reinicio
      # y Let's Encrypt limita cuántos se emiten por semana.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
