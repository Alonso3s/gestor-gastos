services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastos
      POSTGRES_PASSWORD: gastos
      POSTGRES_DB: gastos
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      # Crea la base de pruebas la primera vez que se inicializa el volumen.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gastos -d gastos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
